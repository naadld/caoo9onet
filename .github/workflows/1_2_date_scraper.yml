name: 1.2 Abeka Targeted Date Scraper (Grade & Day)

on:
  workflow_dispatch:
    inputs:
      grade:
        description: 'Target Grade (e.g. Grade 5, K4, 04, Grade 1)'
        required: true
        default: 'Grade 5'
      day:
        description: 'Target Day (e.g. 170, 15, 001)'
        required: true
        default: '170'
      force:
        description: 'Force re-download and overwrite existing files'
        type: boolean
        required: false
        default: false

concurrency:
  group: abeka-step1-2-${{ github.event.inputs.grade }}-${{ github.event.inputs.day }}
  cancel-in-progress: false

jobs:
  scrape_targeted_date:
    name: Scrape Single Grade & Day to GDrive
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "."
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 gspread oauth2client yt-dlp google-api-python-client google-auth

      - name: Install Rclone & FFmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          curl https://rclone.org/install.sh | sudo bash

      - name: Configure Rclone
        run: |
          mkdir -p ~/.config/rclone
          cat << 'EOF' > ~/.config/rclone/rclone.conf
          ${{ secrets.RCLONE_CONF_DATA }}
          EOF

      - name: Configure Google Credentials
        run: |
          cat << 'EOF' > credentials.json
          ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          EOF

      - name: Run Step 1.2 Scraper
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          GRADE="${{ github.event.inputs.grade }}"
          DAY="${{ github.event.inputs.day }}"
          FORCE="${{ github.event.inputs.force }}"

          CMD="python3 -u step1.2/step1_2_date_scraper.py --grade \"$GRADE\" --day \"$DAY\""
          if [ "$FORCE" = "true" ]; then
            CMD="$CMD --force"
          fi

          echo "Executing: $CMD"
          eval $CMD

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add database_*.json index_songsong.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto(step1.2): sync database & html for ${{ github.event.inputs.grade }} day ${{ github.event.inputs.day }}" && git push origin main)
